name: Deployment Pipeline

on:
  push:
    branhces:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: install dependencies
        run: npm ci
      - name: Check Style
        run: npm run lint